name = "rss-feed-ai-intelligence"
main = "src/index.ts"
compatibility_date = "2025-12-01"

[[d1_databases]]
binding = "RSS_DB"
database_name = "rss_feed_db"
database_id = "PASTE_YOUR_D1_DATABASE_ID"

[[kv_namespaces]]
binding = "HOT_EVENTS"
id = "PASTE_YOUR_HOT_EVENTS_KV_NAMESPACE_ID"

[[kv_namespaces]]
binding = "FEED_CACHE"
id = "PASTE_YOUR_FEED_CACHE_KV_NAMESPACE_ID"

[triggers]
crons = ["0,30 * * * *"]

[vars]
DEFAULT_FEED_TTL_SECONDS = "1800"
HOT_EVENT_TTL_SECONDS = "300"
DUPLICATE_TTL_SECONDS = "604800"
