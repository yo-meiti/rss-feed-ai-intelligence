[[d1_databases]]
binding = "RSS_DB"
database_name = "rss_feed_db"
database_id = "9854adf7-7378-4194-ad08-658ae16d9c6e"

[[kv_namespaces]]
binding = "DEDUP"
id = "5858097728384f89af19ad270087dc8a"

[[kv_namespaces]]
binding = "HOT_EVENTS"
id = "0420368d7130481fabc7c491ecadc185"

[[kv_namespaces]]
